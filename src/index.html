<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link rel="stylesheet" href="assets/styles/style.css">
</head>
<body>
  <div class="left">
    <div class="pizza-options">
      <div class="pizza-option" data-type="Пепперони">
        <img src="assets/img/Пепперони.jpg" alt="Пепперони">
        <div>Пепперони</div>
      </div>
      <div class="pizza-option" data-type="Маргарита">
        <img src="assets/img/Маргарита.jpg" alt="Маргарита">
        <div>Маргарита</div>
      </div>
      <div class="pizza-option" data-type="Баварская">
        <img src="assets/img/Баварская.jpg" alt="Баварская">
        <div>Баварская</div>
      </div>
    </div>
  </div>
  <div class="right">
    <h3>Выберите размер</h3>
    <div class="size-buttons">
        <input type="radio" name="pizzaSize" id="sizeSmall" value="маленькая" checked hidden>
        <label for="sizeSmall" class="size-btn">Маленькая</label>
        
        <input type="radio" name="pizzaSize" id="sizeLarge" value="большая" hidden>
        <label for="sizeLarge" class="size-btn">Большая</label>
    </div>
    <h3>Добавить по вкусу</h3>
    <div class="addons">
      <div class="addon" data-name="сырный борт" data-price="189" data-cal="50">
        <img src="assets/img/Бортик.png" alt="">
        <div>Сырный бортик</div>
        <small>150₽</small>
      </div>
      <div class="addon" data-name="сливочная моцарелла" data-price="99" data-cal="20">
        <img src="assets/img/Моцарелла.png" alt="">
        <div>Сливочная моцарелла</div>
        <small>50₽</small>
      </div>
      <div class="addon" data-name="чеддер и пармезан" data-price="99" data-cal="20">
        <img src="assets/img/Чеддер.png" alt="">
        <div>Чеддер и пармезан</div>
        <small>150</small>
      </div>
    </div>
    <button class="cart-button" id="cartButton">Добавить в корзину за 0₽ (0 Ккал)</button>
  </div>
  <script  src="index.js"></script>

</body>
</html>
